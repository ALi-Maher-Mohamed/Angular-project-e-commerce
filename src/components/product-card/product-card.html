<div class="product-card" [class.out-of-stock]="isOutOfStock" [class.favorited]="isFavorited"
    [class.in-cart]="isInCart">
    <button type="button" class="favorite-badge" [class.active]="isFavorited" (click)="toggleFavorite.emit()"
        [attr.aria-label]="isFavorited ? 'Remove from favorites' : 'Add to favorites'">
        ♥
    </button>

    <div class="card-image-wrapper">
        <img [src]="product.thumbnail" [alt]="product.title" class="card-img" />
    </div>

    <div class="card-body">
        <div class="card-heading">
            <h5 class="card-title">{{ product.title }}</h5>
            <p class="card-price">${{ product.price }}</p>
        </div>

        @if (isOutOfStock) {
        <p class="stock-status out-of-stock-text">Out Of Stock</p>
        } @else {
        <p class="stock-status in-stock-text">In Stock ({{ product.stock }})</p>
        <div class="quantity-controls">
            <button class="qty-btn" (click)="decrement()" [disabled]="quantity() <= 1">-</button>
            <span class="qty-value">{{ quantity() }}</span>
            <button class="qty-btn" (click)="increment()" [disabled]="quantity() >= product.stock">+</button>
        </div>
        }

        <p class="card-description">
            @if (showFullDescription()) {
            {{ product.description }}
            } @else {
            {{ product.description | shortDescription }}
            }
        </p>

        <button class="btn-toggle-desc" (click)="toggleDescription()">
            {{ showFullDescription() ? 'Show Less' : 'See All Description' }}
        </button>

        <div class="card-actions">
            <button class="btn-cart" [class.in-cart]="isInCart" [disabled]="!canAddToCart" (click)="onCartClick()">
                {{ isInCart ? 'Remove from Cart' : 'Add to Cart' }}
            </button>

            <a [routerLink]="detailsLink" class="btn-details">
                Details
            </a>

            @if (authService.isAdmin) {
            <button type="button" class="btn-delete" (click)="delete.emit(product.id)">
                Delete
            </button>
            }
        </div>
    </div>
</div>
