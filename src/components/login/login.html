<div class="auth-container">
  <div class="auth-card">
    <h2>Login</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="username">Username</label>
        <input id="username" formControlName="username" placeholder="Enter username" />
        @if (loginForm.get('username')?.invalid && loginForm.get('username')?.touched) {
          <small class="error">Username is required</small>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter password" />
        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <small class="error">Password is required</small>
        }
      </div>

      <button type="submit" [disabled]="loginForm.invalid">Login</button>
    </form>

    <p class="auth-link">Don't have an account? <a routerLink="/signup">Sign Up</a></p>
  </div>
</div>
